apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-flask-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-flask-app
  template:
    metadata:
      labels:
        app: devops-flask-app
    spec:
      containers:
        - name: flask
          image: umerazizrana/devops-flask-app:build-8
          ports:
            - name: http
              containerPort: 5001
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
